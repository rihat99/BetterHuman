site_name: BetterHuman
site_description: SMPL, SMPL-X and MHR human bodies as batched, differentiable BetterRobot models.
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.tooltips
    - navigation.footer
    - navigation.path
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/guidebook.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: output
          class: br-output no-copy
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            show_root_heading: false
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            filters: ["!^_"]
            show_if_no_docstring: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/first-human.md
  - Concepts:
      - concepts/architecture.md
      - concepts/skinning.md
      - concepts/segmentation.md
  - Guides:
      - guides/load-a-family.md
      - guides/convert-weights.md
      - guides/use-the-studio.md
      - guides/run-the-tests.md
      - guides/run-the-benchmarks.md
  - Reference:
      - API:
          - better_human: reference/api/better_human.md
          - core: reference/api/core.md
          - families: reference/api/families.md
          - io: reference/api/io.md
          - mass: reference/api/mass.md
          - terms: reference/api/terms.md
          - viz: reference/api/viz.md
          - studio: reference/api/studio.md
      - reference/tests.md
      - reference/benchmarks.md
      - reference/glossary.md
      - reference/roadmap.md
      - File formats:
          - MHR archive: reference/formats/mhr.md
          - SOMA archive: reference/formats/soma.md
          - Frame set: reference/formats/frame_set.md
          - Closed segmentation: reference/formats/segmentation.md
          - Density tables: reference/formats/density_tables.md
          - Studio segmentation: reference/formats/studio_segmentation.md
          - Studio pose: reference/formats/studio_pose.md
  - Contracts:
      - Index: contracts/index.md
      - Scope: contracts/scope.md
      - Public surface: contracts/public-surface.md
      - Rules: contracts/rules.md
      - Coupling standard: contracts/coupling-standard.md
