# Local hooks only: each runs through `uv run`, so ruff and pytest are the lockfile's versions.
# pre-commit: lint, format check and the fast tier; pre-push: the full tier. The release tier runs by hand.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: fast-tier
        name: fast tier (tests/contract, not slow)
        entry: uv run pytest tests/contract -q -m "not slow"
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: full-tier
        name: full tier (not cuda, not licensed)
        entry: uv run pytest tests -q -m "not cuda and not licensed"
        language: system
        pass_filenames: false
        stages: [pre-push]
