[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-human"
version = "0.1.0.dev0"
description = "Parametric human body models on a robotics core."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "better-robot",
    "numpy>=2.0",
    "scipy>=1.11",
    "torch>=2.4",
]

[project.optional-dependencies]
viewer = ["better-robot[viewer]"]
studio = ["better-robot[viewer]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
    "pre-commit>=3.7",
    "matplotlib>=3.8",  # docs/render_segmentation.py draws the segmentation figures
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
better-robot = { path = "../BetterRobot", editable = true }
torch = { index = "pytorch-cu129" }

[tool.hatch.build.targets.wheel]
packages = ["src/better_human"]
# Ship the authored segmentation and density tables (data, not source) in the
# wheel and keep them included even if a future VCS ignore rule matches them.
artifacts = ["*.npy", "*.json"]

[tool.pytest.ini_options]
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["tests"]
xfail_strict = true
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
    "error",
]
markers = [
    "licensed: reads licensed weights from $BETTERHUMAN_MODELS_DIR; deselected in the fast and full tiers, run in the release tier",
    "cuda: needs a CUDA device; deselected in the fast and full tiers, run in the release tier",
    "slow: takes seconds; deselected in the fast tier, run in the full tier",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "PLC", "PLE", "PLR", "PLW"]
ignore = ["E501", "PLR0913", "PLR2004"]
