[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-human"
version = "0.2.0"
description = "Parametric human body models on a robotics core."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "better-robot",
    "numpy>=2.0",
    "torch>=2.4",
]

[project.optional-dependencies]
studio = ["better-robot[viewer]"]  # the browser viewer (better_human.viz) and HumanStudio

[dependency-groups]
dev = [
    "better-robot[viewer]",  # tests/studio/test_app.py runs the studio on a real viser server
    "pytest>=8.0",
    "scipy>=1.11",  # tests/io run tools/convert/smpl/convert_chumpy.py
    "ruff",
    "pre-commit>=3.7",
    "matplotlib>=3.8",  # tools/render_segmentation.py draws the segmentation figures
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
better-robot = { path = "../BetterRobot", editable = true }
torch = { index = "pytorch-cu129" }

[tool.hatch.build.targets.wheel]
packages = ["src/better_human"]
# Ship the mass archives, frame sets and studio segmentations (data, not source) in the
# wheel and keep them included even if a future VCS ignore rule matches them.
artifacts = ["*.npz", "*.json"]

[tool.pytest.ini_options]
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["tests"]
xfail_strict = true
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
    "error",
]
markers = [
    "licensed: reads licensed weights from $BETTERHUMAN_MODELS_DIR; deselected in the fast and full tiers, run in the release tier",
    "cuda: needs a CUDA device; deselected in the fast and full tiers, run in the release tier",
    "slow: takes seconds; deselected in the fast tier, run in the full tier",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# BetterRobot's select, so both repositories hold one rule set; SLF001 is this repository's own (record 0009).
select = ["E", "F", "PLC", "PLE", "PLR", "PLW", "B006", "B008", "T201", "E722", "TID251",
          "FBT001", "FBT002", "BLE001", "ERA001", "ANN201", "S102", "S307"]
extend-select = ["SLF001"]
ignore = ["E501", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "FBT001", "FBT002"]
"examples/**" = ["T201"]
"benchmarks/**" = ["T201"]  # scripts that report on stdout, as the examples do
"tools/render_segmentation.py" = ["T201"]  # reports the figures it writes
"!src/better_human/studio/**" = ["SLF001"]  # record 0009 binds the studio; tests and tools may reach in

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"torch.set_default_dtype".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.set_default_device".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.set_grad_enabled".msg = "C-DEP-3: no global autograd switches inside the library"
"torch.use_deterministic_algorithms".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.set_float32_matmul_precision".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.manual_seed".msg = "C-DEP-3: no process-wide RNG seeding inside the library; take a generator"
"torch.set_num_threads".msg = "C-DEP-3: no process-wide thread settings inside the library"
"torch.set_num_interop_threads".msg = "C-DEP-3: no process-wide thread settings inside the library"
