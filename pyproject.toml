[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-human"
version = "0.1.0.dev0"
description = "Parametric human body models on a robotics core."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "better-robot",
    "numpy>=2.0",
    "scipy>=1.11",
    "torch>=2.4",
]

[project.optional-dependencies]
viewer = ["better-robot[viewer]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
better-robot = { path = "../BetterRobot", editable = true }
torch = { index = "pytorch-cu126" }

[tool.hatch.build.targets.wheel]
packages = ["src/better_human"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "PLC", "PLE", "PLR", "PLW"]
ignore = ["E501", "PLR0913", "PLR2004"]
